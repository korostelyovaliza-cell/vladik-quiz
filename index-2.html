<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:dark}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<title>Викторина Владика</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=Unbounded:wght@500;700;900&display=swap">
<style>
/* Layout: party game for a TV or laptop — a strip of team scores, a menu of numbered soda-bottle caps, one big stage card per question. Deliberately single dark "cola" look. */
:root{
  --bg:#22070a;
  --bg-2:#35090e;
  --surface:#46111a;
  --surface-2:#5a1620;
  --line:rgba(251,238,221,.16);
  --red:#e3141d;
  --red-deep:#9e0c13;
  --red-hi:#ff5a5f;
  --cream:#fbeedd;
  --muted:rgba(251,238,221,.7);
  --gold:#f4c44f;
  --ok:#7fd69b;
  --bad:#ff8a7a;
  --ink:#1c0406;
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  background:
    radial-gradient(circle at 12% 8%, rgba(255,90,95,.18) 0 2px, transparent 3px) 0 0/90px 90px,
    radial-gradient(circle at 60% 40%, rgba(251,238,221,.08) 0 3px, transparent 4px) 0 0/140px 140px,
    radial-gradient(ellipse at 50% -10%, var(--bg-2), var(--bg) 60%) fixed,
    var(--bg);
  color:var(--cream);
  font-family:var(--body);
  font-size:17px;
  line-height:1.5;
}
.wrap{
  max-width:1120px;margin:0 auto;
  padding-block:20px 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:22px;
}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--gold);outline-offset:3px}

/* ---------- header ---------- */
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px}
.eyebrow{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:800}
h1{font-family:var(--display);font-weight:900;font-size:clamp(1.7rem,4.6vw,3.2rem);line-height:1.05;margin:4px 0 0;text-wrap:balance}
h1 em{font-style:normal;color:var(--red-hi)}

/* ---------- scoreboard ---------- */
.score{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.team{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 6px 5px 14px}
.team input{background:transparent;border:0;color:var(--cream);font:600 .95rem var(--body);width:8.5em;min-width:0;padding:2px 0}
.team .pts{font-family:var(--display);font-weight:700;font-size:1.2rem;min-width:2ch;text-align:center;color:var(--gold);font-variant-numeric:tabular-nums}
.round{width:32px;height:32px;border-radius:50%;border:0;background:var(--surface-2);font-weight:800;font-size:1.1rem;line-height:1;display:grid;place-items:center}
.round:hover{background:var(--red)}
.round.del{background:transparent;color:var(--muted);font-size:.9rem;width:24px}
.ghost{background:transparent;border:1px dashed var(--line);border-radius:999px;padding:8px 14px;color:var(--muted);font-weight:600}
.ghost:hover{color:var(--cream);border-color:var(--cream)}
.btn.small{padding:8px 16px;font-size:.92rem;box-shadow:0 4px 0 var(--red-deep)}
.round.del.sure{width:auto;padding:0 10px;border-radius:999px;background:var(--bad);color:var(--ink);font-size:.8rem;font-weight:800}
.lead{margin:0;color:var(--muted);max-width:65ch}

/* players answers */
.players-panel{display:flex;flex-direction:column;gap:10px;background:var(--bg-2);border:1px solid var(--line);border-radius:20px;padding:16px 18px}
.players-panel .ph{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}
.prow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding-top:10px;border-top:1px solid var(--line)}
.prow .pn{font-weight:800;flex:0 0 8.5em;min-width:0;overflow-wrap:anywhere}
.prow input{flex:1 1 200px;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;color:var(--cream);font:inherit}
.abcd{display:flex;gap:6px}
.abcd button{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-family:var(--display);font-weight:700}
.abcd button:not([disabled]):hover{border-color:var(--cream)}
.abcd button.sel{background:var(--cream);color:var(--ink);border-color:var(--cream)}
.abcd button.right{background:var(--ok);color:var(--ink);border-color:var(--ok)}
.abcd button.wrong{background:var(--bad);color:var(--ink);border-color:var(--bad)}
.abcd button.hint-right{border:2px dashed var(--ok)}
.abcd button[disabled]{cursor:default}
.okbtn{border-radius:999px;padding:8px 14px;border:1px solid var(--line);background:var(--surface);font-weight:800}
.okbtn:hover{border-color:var(--ok)}
.okbtn.on{background:var(--ok);color:var(--ink);border-color:var(--ok)}
.mark{font-weight:800}.mark.y{color:var(--ok)}.mark.n{color:var(--bad)}

/* card votes */
.cardwrap{display:flex;flex-direction:column;gap:8px;min-width:0}
.cardwrap .card{width:100%}
.votes{display:flex;flex-wrap:wrap;gap:4px}
.vote{font-size:.74rem;border-radius:999px;padding:4px 9px;border:1px solid var(--line);background:var(--bg-2);font-weight:700;max-width:100%;overflow-wrap:anywhere}
.vote.v1{background:var(--red);border-color:var(--red)}
.vote.v0{background:var(--surface-2);border-color:var(--cream)}
.vote.y{box-shadow:0 0 0 2px var(--ok)}
.vote.n{opacity:.45}
.vote[disabled]{cursor:default}

/* leaderboard */
.champ{background:var(--cream);color:var(--ink);border-radius:22px;padding:22px 26px;display:flex;flex-direction:column;gap:4px}
.champ .lbl{font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:var(--red-deep)}
.champ .big{font-family:var(--display);font-weight:900;font-size:clamp(1.5rem,4vw,2.6rem);line-height:1.1}
.champ .fact{font-weight:700}
.lb-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:18px}
.lb{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;min-width:640px}
.lb th,.lb td{padding:12px 10px;text-align:center;border-bottom:1px solid var(--line)}
.lb tbody tr:last-child td{border-bottom:0}
.lb th{font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--gold);font-weight:800;vertical-align:bottom}
.lb th .cap{width:34px;margin:0 auto 6px}
.lb th .cap span{font-size:.85rem}
.lb th .th-name{display:block;max-width:9em;margin:0 auto;text-transform:none;letter-spacing:0;font-size:.72rem;color:var(--muted);line-height:1.2}
.lb .name{text-align:left;font-weight:800}
.lb td.rank{font-size:1.3rem;width:3.5em}
.lb td .of{color:var(--muted);font-size:.75em}
.lb td.best{color:var(--ok);font-weight:800}
.lb td.total{font-family:var(--display);font-weight:900;font-size:1.4rem;color:var(--gold)}
.lb tr.top1 td{background:rgba(244,196,79,.12)}
h4.sub{font-family:var(--display);font-weight:700;font-size:1rem;margin:0 0 8px;color:var(--gold)}
.champs{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px;color:var(--muted)}
.champs b{color:var(--cream)}
.join-card{display:flex;flex-wrap:wrap;gap:18px 24px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px}
.qr{background:#fff;border-radius:14px;padding:8px;width:200px;max-width:100%;flex:none}
.qr svg{display:block;width:100%;height:auto}
.join-text{flex:1 1 260px;min-width:0;display:flex;flex-direction:column;gap:8px}
.join-text b{font-family:var(--display);font-size:1.15rem}
.join-text p{margin:0;color:var(--muted)}
.join-text .link{display:flex;flex-wrap:wrap;gap:8px;align-items:center;color:var(--cream);font-weight:700;overflow-wrap:anywhere}
.join-text .link span{min-width:0;overflow-wrap:anywhere}
.photos{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.ph-tile{position:relative;aspect-ratio:3/4;max-width:100%;border-radius:18px;overflow:hidden;background:var(--bg-2);border:3px solid var(--line);display:flex;align-items:center;justify-content:center}
.ph-tile img{width:100%;height:100%;object-fit:cover;display:block}
.ph-tile .l,.ph-slot .l{position:absolute;top:8px;left:8px;z-index:1;background:var(--ink);color:var(--gold);font-family:var(--display);font-weight:900;border-radius:10px;padding:2px 10px;font-size:1.2rem}
.ph-tile.right{border-color:var(--ok);box-shadow:0 0 0 4px rgba(127,214,155,.35)}
.ph-tile.dim{opacity:.35}
.ph-tile .badge{position:absolute;bottom:8px;left:8px;right:8px;text-align:center;background:var(--ok);color:var(--ink);font-weight:800;border-radius:999px;padding:4px 8px}
.ph-empty{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--muted);text-align:center;padding:8px}
.ph-empty span{font-size:3rem;line-height:1}
.ph-empty small{font-size:.75rem}
.ph-edit{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.ph-slot{position:relative;display:flex;flex-direction:column;gap:8px;align-items:stretch;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px;min-width:0}
.ph-slot img,.ph-slot .ph-empty{aspect-ratio:3/4;width:100%;max-width:100%;object-fit:cover;border-radius:10px;background:var(--bg-2);justify-content:center}
.small-btn{text-align:center;padding:9px 12px;font-size:.88rem;cursor:pointer}
.radio{display:flex;gap:6px;align-items:center;font-weight:700;font-size:.9rem;cursor:pointer}
.collage{display:flex;flex-direction:column;gap:8px}
.parts{display:flex;flex-wrap:wrap;gap:10px}
.parts figure{margin:0;width:110px;max-width:100%;position:relative}
.parts img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:14px;border:2px solid var(--ok);display:block}
.parts figcaption{position:absolute;bottom:4px;right:6px;font-size:1.4rem}
@media (max-width:640px){.photos,.ph-edit{grid-template-columns:repeat(2,minmax(0,1fr))}}
.team.off{opacity:.5}
.diag{font-size:.75rem;color:var(--muted);width:100%}
p.diag{margin:0}
.pname{font-weight:600;font-size:.95rem;display:inline-flex;align-items:center;gap:6px;max-width:10em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
i.live{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.team.off i.live{background:var(--muted)}
.howto{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;color:var(--muted);max-width:none}
.howto b{color:var(--cream)}
.pill{font-size:.8rem;font-weight:800;border-radius:999px;padding:4px 12px}
.pill.ok{background:rgba(127,214,155,.18);color:var(--ok)}
.pill.bad{background:rgba(255,138,122,.16);color:var(--bad)}
.status{display:flex;flex-wrap:wrap;gap:8px}
.who{border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:700;color:var(--muted);display:inline-flex;align-items:center;gap:8px}
.who.yes{background:var(--ok);color:var(--ink);border-color:var(--ok)}
.who.manual{color:var(--cream)}
.abcd.inline button{width:32px;height:32px;border-radius:9px;font-size:.85rem}
.given{flex:1 1 200px;min-width:0;overflow-wrap:anywhere;font-size:1.05rem}
.tally{display:flex;justify-content:space-between;gap:8px;font-size:.8rem;color:var(--muted)}
.tally b{color:var(--cream)}
/* player phone */
body[data-role="player"] .score{display:none}
body[data-role="player"] h1{font-size:clamp(1.4rem,7vw,2.2rem)}
.me-bar{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 12px;align-items:center;color:var(--muted);font-size:.92rem}
.me-bar b{color:var(--cream)}
.linkish{background:none;border:0;padding:0;color:var(--gold);text-decoration:underline;font-weight:700}
.mypts{font-family:var(--display);font-weight:700;color:var(--gold);font-size:1.05rem}
.stage.phone{min-height:0;gap:18px}
.stage.phone .qtext{font-size:clamp(1.2rem,5.4vw,1.8rem)}
.stage.phone p{margin:0}
.joinrow{display:flex;flex-wrap:wrap;gap:10px}
.joinrow input{flex:1 1 180px;min-width:0;background:var(--bg-2);border:1px solid var(--line);border-radius:14px;padding:13px 16px;color:var(--cream);font:inherit;font-size:1.1rem}
.popts{display:grid;grid-template-columns:1fr;gap:10px}
.popts .opt{cursor:pointer;width:100%}
.popts .opt.sel{border-color:var(--cream);background:var(--surface-2)}
.popts .opt[disabled]{cursor:default}
.pans{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.pans textarea{width:100%;background:var(--bg-2);border:1px solid var(--line);border-radius:14px;padding:13px 16px;color:var(--cream);font:inherit;font-size:1.1rem;resize:vertical}
.mini-board{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.mini-board li{display:flex;align-items:center;gap:12px;background:var(--bg-2);border:1px solid var(--line);border-radius:14px;padding:10px 14px;font-variant-numeric:tabular-nums}
.mini-board li.mine{border-color:var(--gold);background:rgba(244,196,79,.12)}
.mini-board .rk{width:2em;text-align:center;font-size:1.15rem}
.mini-board .nm{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:700}
.mini-board b{font-family:var(--display);color:var(--gold)}
.pcards{display:flex;flex-direction:column;gap:8px}
.pcard{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;background:var(--bg-2);border:1px solid var(--line);border-radius:16px;padding:10px 12px}
.pcard .pe{font-size:2rem;line-height:1}
.pc-body{flex:1 1 120px;min-width:0;display:flex;flex-direction:column}
.pc-btns{display:flex;gap:6px}
.pc-btns button{border-radius:999px;padding:8px 12px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:.85rem}
.pc-btns button.sel{background:var(--cream);color:var(--ink);border-color:var(--cream)}
.pc-btns button[disabled]{cursor:default;opacity:.7}
.btn.danger{background:var(--bad);color:var(--ink);border-color:var(--bad)}

/* ---------- menu ---------- */
.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.tile{
  display:flex;flex-direction:column;align-items:flex-start;gap:12px;text-align:left;
  background:linear-gradient(180deg,var(--surface),var(--bg-2));
  border:1px solid var(--line);border-radius:22px;padding:20px;position:relative;
  transition:transform .18s ease, border-color .18s ease;
}
.tile:hover{transform:translateY(-3px);border-color:rgba(251,238,221,.4)}
.tile h3{font-family:var(--display);font-weight:700;font-size:1.12rem;line-height:1.2;margin:0;text-wrap:balance}
.tile p{margin:0;color:var(--muted);font-size:.95rem}
.tile .meta{margin-top:auto;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);font-weight:800}
.tile .done{position:absolute;top:16px;right:16px;font-size:.75rem;font-weight:800;background:var(--ok);color:var(--ink);border-radius:999px;padding:3px 10px}
.cap{
  width:84px;aspect-ratio:1;max-width:100%;border-radius:50%;flex:none;
  background:repeating-conic-gradient(var(--red-deep) 0 6deg,var(--red) 6deg 12deg);
  display:grid;place-items:center;
  box-shadow:0 6px 16px rgba(0,0,0,.35);
}
.cap span{
  width:78%;aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle at 34% 28%,var(--red-hi),var(--red) 55%,var(--red-deep));
  display:grid;place-items:center;
  font-family:var(--display);font-weight:900;font-size:1.9rem;color:var(--cream);
  box-shadow:inset 0 -4px 0 rgba(0,0,0,.18), inset 0 0 0 2px rgba(251,238,221,.25);
}
.tile:hover .cap{animation:spin .6s ease}
@keyframes spin{to{transform:rotate(180deg)}}

details.cheat{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:4px 18px}
details.cheat summary{cursor:pointer;font-weight:800;padding:12px 0;list-style:none}
details.cheat summary::-webkit-details-marker{display:none}
details.cheat summary::before{content:"▸ ";color:var(--gold)}
details.cheat[open] summary::before{content:"▾ "}
.cheat h4{font-family:var(--display);font-weight:700;font-size:1rem;margin:18px 0 8px;color:var(--gold)}
.cheat ol{margin:0 0 12px;padding-left:1.4em;display:flex;flex-direction:column;gap:6px}
.cheat li{color:var(--muted)}
.cheat li b{color:var(--cream)}

/* ---------- stage ---------- */
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px}
.back{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-weight:700}
.back:hover{background:var(--surface-2)}
.bar h2{font-family:var(--display);font-weight:700;font-size:clamp(1.1rem,2.6vw,1.6rem);margin:0;flex:1 1 240px;min-width:0;display:flex;align-items:center;gap:12px}
.bar h2 .cap{width:46px}
.bar h2 .cap span{font-size:1.05rem}
.dots{display:flex;flex-wrap:wrap;gap:6px}
.dot{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:transparent;font-size:.78rem;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.dot.on{background:var(--cream);color:var(--ink);border-color:var(--cream)}
.dot.seen{border-color:var(--red-hi);color:var(--cream)}

.stage{
  background:linear-gradient(180deg,var(--surface),var(--bg-2));
  border:1px solid var(--line);border-radius:28px;
  padding:clamp(22px,4vw,48px);
  display:flex;flex-direction:column;gap:24px;min-height:340px;
}
.qnum{font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:800}
.qtext{font-family:var(--display);font-weight:500;font-size:clamp(1.3rem,3.2vw,2.3rem);line-height:1.25;margin:0;text-wrap:balance}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.opt{
  text-align:left;background:var(--bg-2);border:2px solid var(--line);border-radius:16px;
  padding:14px 18px;font-size:1.1rem;font-weight:600;display:flex;gap:12px;align-items:center;
}
.opt .l{font-family:var(--display);font-weight:700;color:var(--gold);flex:none}
.opt.right{border-color:var(--ok);background:rgba(127,214,155,.16)}
.opt.wrong{border-color:var(--bad);background:rgba(255,138,122,.12);opacity:.85}
.answer{
  background:var(--cream);color:var(--ink);border-radius:20px;padding:20px 24px;
  display:flex;flex-direction:column;gap:6px;animation:pop .35s ease;
}
.answer .lbl{font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:var(--red-deep)}
.answer .big{font-family:var(--display);font-weight:700;font-size:clamp(1.15rem,2.6vw,1.7rem);line-height:1.25}
.answer .fact{font-size:1rem;opacity:.85}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}
.actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:auto}
.btn{border:0;border-radius:999px;padding:13px 24px;font-weight:800;font-size:1rem;background:var(--surface-2);border:1px solid var(--line)}
.btn:hover{background:var(--bg-2)}
.btn.primary{background:var(--red);border-color:var(--red);box-shadow:0 6px 0 var(--red-deep)}
.btn.primary:hover{background:var(--red-hi)}
.btn.primary:active{transform:translateY(3px);box-shadow:0 3px 0 var(--red-deep)}
.btn[disabled]{opacity:.4;cursor:default}
.spacer{flex:1}
.hint{color:var(--muted);font-size:.85rem}

/* Liza editor */
.editor{display:flex;flex-direction:column;gap:12px;background:var(--bg-2);border:1px dashed var(--gold);border-radius:20px;padding:18px}
.editor p{margin:0;color:var(--muted);font-size:.95rem}
.erow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;align-items:center}
.erow label{font-size:.95rem}
.erow input{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;color:var(--cream);font:inherit;min-width:0;width:100%}
@media (max-width:640px){.erow{grid-template-columns:1fr;gap:4px}}

/* ---------- best day ---------- */
.steps{display:flex;flex-direction:column;gap:18px}
.step h4{margin:0 0 8px;font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--bg-2);border:1px solid var(--line);border-radius:14px;padding:9px 14px;font-weight:600;text-align:left;max-width:100%}
.chip:hover{border-color:var(--cream)}
.chip.sel{background:var(--cream);color:var(--ink);border-color:var(--cream)}
.chip.flash{animation:pop .25s ease}
.story{background:var(--cream);color:var(--ink);border-radius:22px;padding:22px 26px}
.story h3{font-family:var(--display);font-weight:900;font-size:1.3rem;margin:0 0 10px;color:var(--red-deep)}
.story p{margin:0;font-size:1.12rem;line-height:1.6}
.story .empty{opacity:.6}

/* ---------- cards ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.card{perspective:900px;background:none;border:0;padding:0;aspect-ratio:3/4;max-width:100%;text-align:center}
.card .in{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.3,.7,.3,1);transform-style:preserve-3d}
.card.flipped .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px;border:1px solid var(--line)}
.front{background:linear-gradient(180deg,var(--surface-2),var(--surface))}
.front .pic{font-size:clamp(3.4rem,8vw,4.6rem);line-height:1;filter:drop-shadow(0 6px 10px rgba(0,0,0,.35))}
.front .nm{font-family:var(--display);font-weight:700;font-size:1rem;line-height:1.2}
.front .tap{font-size:.75rem;color:var(--muted)}
.back-f{background:var(--cream);color:var(--ink);transform:rotateY(180deg)}
.verdict{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;font-weight:800;border-radius:999px;padding:4px 10px;background:var(--red);color:var(--cream)}
.verdict.ok{background:var(--ink);color:var(--gold)}
.back-f .joke{font-size:.98rem;font-weight:600;line-height:1.35}
.back-f .mini{font-size:1.8rem}
.card.special .front{background:radial-gradient(circle at 50% 30%,var(--red-hi),var(--red) 60%,var(--red-deep))}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
@media (max-width:520px){
  body{font-size:16px}
  .stage{border-radius:22px}
  .cards{grid-template-columns:repeat(2,minmax(0,1fr))}
  .team input{width:6.5em}
}

    return `<div class="ph-tile ${cls}"><span class="l">${LET[i]}</span>${src ? `<img src="${src}" alt="Фото ${LET[i]}">` : `<span class="ph-empty"><span>${it.e}</span><small>фото ещё не загружено</small></span>`}${rev && i===it.c ? '<span class="badge">Это Владик!</span>' : ''}</div>`;
  }).join('')}</div>`;
}
function shrinkImage(file){
  return new Promise((res, rej)=>{
    const fr = new FileReader();
    fr.onload = ()=>{ const img = new Image(); img.onload = ()=>{
      const m = 520, k = Math.min(1, m/Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width*k); c.height = Math.round(img.height*k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); res(c.toDataURL('image/jpeg', 0.72)); };
      img.onerror = rej; img.src = fr.result; };
    fr.onerror = rej; fr.readAsDataURL(file);
  });
}

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const getAns = (k, pid) => (G.ans[k] || {})[pid] || {};
const setAns = (k, pid, patch) => { G.ans[k] = G.ans[k] || {}; G.ans[k][pid] = Object.assign({}, G.ans[k][pid], patch); };
const isRev = k => !!G.rev[k];

function themeScore(th, pid){
  if (th.type === 'cards') return CARDS.reduce((s,c,i)=> s + (G.flipped[i] && G.votes[i] && G.votes[i][pid] === c.v ? 1 : 0), 0);
  return th.items.reduce((s,it,q)=>{
    const k = key(th.id,q); if (!isRev(k)) return s;
    const a = getAns(k,pid);
    return s + (it.o ? (a.p === it.c ? 1 : 0) : (a.ok ? 1 : 0));
  }, 0);
}
const total = pid => SCORED.reduce((s,th)=>s+themeScore(th,pid),0);
const answered = a => (a.t && a.t.trim()) || a.p != null;

/* ---- incoming player answers ---- */
function validKey(k){
  const [tid, q] = String(k).split(':'); const th = THEMES.find(x=>x.id===tid);
  return th && th.items && Number.isInteger(+q) && +q >= 0 && +q < th.items.length ? th : null;
}
function ingest(peers){
  let changed = false; const online = new Set();
  for (const pr of peers){
    const ps = pr.presence || {};
    if (ps.role !== 'player' || typeof ps.name !== 'string') continue;
    const name = ps.name.trim().slice(0,30); if (!name) continue;
    const pk = pr.by ? 'u:'+pr.by : 'n:'+name.toLowerCase();
    online.add(pk);
    let pl = G.players.find(x=>x.id===pk);
    if (!pl){ pl = {id:pk, name, remote:true}; G.players.push(pl); changed = true; }
    else if (pl.name !== name){ pl.name = name; changed = true; }
    if (ps.ep !== G.ep) continue;              // answers from a previous game
    const a = ps.a;
    if (a && typeof a === 'object' && typeof a.k === 'string'){
      const th = validKey(a.k);
      if (th && !isRev(a.k)){
        const cur = getAns(a.k, pk);
        const t = typeof a.t === 'string' ? a.t.slice(0,300) : '';
        const p = th.items[+a.k.split(':')[1]].o && Number.isInteger(a.p) && a.p>=0 && a.p<4 ? a.p : null;
        if ((cur.t||'') !== t || (cur.p ?? null) !== p){ setAns(a.k, pk, {t, p}); changed = true; }
      }
    }
    const c = ps.c;
    if (c && typeof c === 'object'){
      for (const [i,v] of Object.entries(c)){
        const n = +i; if (!CARDS[n] || G.flipped[n]) continue;
        if (v !== 0 && v !== 1) continue;
        G.votes[n] = G.votes[n] || {};
        if (G.votes[n][pk] !== v){ G.votes[n][pk] = v; changed = true; }
      }
    }
  }
  const onlineChanged = online.size !== H.online.size || [...online].some(x=>!H.online.has(x));
  H.online = online;
  if (changed) save();
  if (changed || onlineChanged) hostRender(); else renderScore();
}

let lastPush = '';
function pushHost(){
  if (!room) return;
  const th = THEMES[H.t];
  const k = H.view==='theme' && th.items ? key(th.id,H.q) : null;
  const pl = G.players.map(p=>[p.id.slice(0,80), p.name.slice(0,30), total(p.id)]);
  const payload = {
    role:'host', ep:G.ep, v:H.view, t:H.t, q:H.q,
    rev: k ? isRev(k) : false,
    rc: k && isRev(k) && th.items[H.q] ? th.items[H.q].c : null,
    ok: k && isRev(k) ? G.players.filter(p=>getAns(k,p.id).ok).map(p=>p.id) : [],
    fl: CARDS.map((_,i)=>G.flipped[i]?1:0),
    d: DAY.map((_,i)=>H.day[i] ?? -1),
    pl,
  };
  const s = JSON.stringify(payload);
  if (s === lastPush) return; lastPush = s;
  room.presence({host: payload}).then(()=>{ if(H.err){ H.err=''; renderScore(); } }).catch(e=>{ H.err = (e && (e.code||e.message)) || 'ошибка'; lastPush=''; renderScore(); });
}

          ${manual.length ? `<div class="votes">${manual.map(p=>{
            const v = votes[p.id]; const res = fl && v!=null ? (v===c.v?'y':'n') : '';
            return `<button class="vote ${v===1?'v1':v===0?'v0':''} ${res}" data-a="vote" data-i="${i}" data-id="${esc(p.id)}" ${fl?'disabled':''}>${esc(p.name)} · ${v===1?'не может':v===0?'переживёт':'?'}</button>`;
          }).join('')}</div>` : ''}
          </div>`;
        }).join('')}
      </div>
      <div class="actions">
        <span class="hint">Открыто ${n} из ${CARDS.length}</span>
        <span class="spacer"></span>
        <button class="btn" data-a="flipall">${n===CARDS.length?'Закрыть все':'Открыть все'}</button>
        <button class="btn primary" data-a="finish">Завершить тему → рейтинг</button>
      </div>
    </section>`;
}

function boardRows(players, scoreOf){
  const rows = players.map(p=>({p, tot:scoreOf(p)})).sort((a,b)=>b.tot-a.tot);
  let rank=0, prev=null; rows.forEach((r,i)=>{ if(r.tot!==prev){rank=i+1;prev=r.tot;} r.rank=rank; });
  return rows;
}
const medal = r => r.tot>0 && r.rank<=3 ? ['🥇','🥈','🥉'][r.rank-1] : r.rank;
const joinNames = arr => arr.join(', ').replace(/, ([^,]*)$/, ' и $1');

function hostBoard(){
  const rows = boardRows(G.players, p=>total(p.id)).map(r=>Object.assign(r,{per:SCORED.map(th=>themeScore(th,r.p.id))}));
  const best = SCORED.map((th,k)=>Math.max(0,...rows.map(r=>r.per[k])));
  const leaders = rows.filter(r=>r.rank===1 && r.tot>0);
  const champs = SCORED.map((th,k)=>{
    const who = rows.filter(r=>best[k]>0 && r.per[k]===best[k]).map(r=>esc(r.p.name));
    return who.length ? `<li><b>${th.title}</b>: ${who.join(', ')} (${best[k]} из ${themeMax(th)})</li>` : '';
  }).join('');
  app.innerHTML = `
    <div class="bar"><button class="back" data-a="menu">← Все темы</button><h2><span>🏆 Рейтинг: кто лучше знает все темы</span></h2></div>
    <section class="stage">
      <div class="champ">
        <span class="lbl">${leaders.length ? (leaders.length>1?'Делят первое место':'Лидер') : 'Пока никто не набрал очков'}</span>
        <span class="big">${leaders.length ? joinNames(leaders.map(r=>esc(r.p.name))) : 'Сыграйте первую тему'}</span>
        ${leaders.length ? `<span class="fact">${leaders[0].tot} ${plural(leaders[0].tot,'очко','очка','очков')}</span>` : ''}
      </div>
      <div class="lb-wrap">
        <table class="lb">
          <thead><tr><th>Место</th><th class="name">Игрок</th>${SCORED.map(th=>`<th title="${esc(th.title)}">${cap(th.n)}<span class="th-name">${esc(th.title)}</span></th>`).join('')}<th>Итого</th></tr></thead>
          <tbody>${rows.map(r=>`<tr class="${r.rank===1&&r.tot>0?'top1':''}">
              <td class="rank">${medal(r)}</td><td class="name">${esc(r.p.name)}</td>
              ${r.per.map((v,k)=>`<td class="${v>0&&v===best[k]?'best':''}">${v}<span class="of">/${themeMax(SCORED[k])}</span></td>`).join('')}
              <td class="total">${r.tot}</td></tr>`).join('')}
          </tbody>
        </table>
      </div>
      ${champs ? `<div><h4 class="sub">Лучшие в каждой теме</h4><ul class="champs">${champs}</ul></div>` : ''}
      <div class="actions">
        <button class="btn primary" data-a="menu">К темам</button>
        <span class="spacer"></span>
        ${H.resetAsk
          ? `<span class="hint">Стереть все ответы и очки?</span><button class="btn danger" data-a="reset">Да, новая игра</button><button class="btn" data-a="resetno">Отмена</button>`
          : `<button class="ghost" data-a="resetask">Новая игра</button>`}
      </div>
    </section>`;
}

function hostRender(force){
  const ae = document.activeElement;
  if (!force && ae && ae.matches && ae.matches('#app input, #score input')){ H.pending = true; renderScore(); pushHost(); return; }
  H.pending = false;
  if (H.view==='menu') hostMenu();
  else if (H.view==='board') hostBoard();
  else { const t = THEMES[H.t].type; if (t==='day') hostDay(); else if (t==='cards') hostCards(); else hostQuiz(); }
  renderScore();
  pushHost();
}

function markDone(){ const id = THEMES[H.t].id; if(!G.done.includes(id)){ G.done.push(id); save(); } }
function goQ(i){ const th = THEMES[H.t]; if (i<0 || i>=th.items.length) return; H.q=i; hostRender(true); }
function reveal(){ const th = THEMES[H.t]; G.rev[key(th.id,H.q)] = true; save(); hostRender(true); }
function toBoard(){ H.view='board'; H.editing=false; H.resetAsk=false; hostRender(true); window.scrollTo({top:0}); }
function toMenu(){ H.view='menu'; H.editing=false; hostRender(true); window.scrollTo({top:0}); }
function next(){ const th = THEMES[H.t]; if (H.q === th.items.length-1){ markDone(); toBoard(); } else goQ(H.q+1); }

function hostClick(a, b){
  const i = +b.dataset.i, id = b.dataset.id;
  if (a!=='delplayer' && a!=='askdel') H.delAsk = null;
  switch(a){
    case 'open': H.view='theme'; H.t=i; H.q=0; hostRender(true); window.scrollTo({top:0}); break;
    case 'menu': toMenu(); break;
    case 'board': toBoard(); break;
    case 'go': goQ(i); break;
    case 'prev': goQ(H.q-1); break;
    case 'next': next(); break;
    case 'reveal': reveal(); break;
    case 'mcpick': { const k=key(THEMES[H.t].id,H.q); if(isRev(k)) break; const cur=getAns(k,id).p; setAns(k,id,{p: cur===i?null:i}); save(); hostRender(true); break; }
    case 'ok': { const k=key(THEMES[H.t].id,H.q); setAns(k,id,{ok:!getAns(k,id).ok}); save(); hostRender(true); break; }
    case 'edit': H.editing=!H.editing; hostRender(true); break;
    case 'daypick': H.day[i] = H.day[i]===+b.dataset.j ? null : +b.dataset.j; if(DAY.every((_,k)=>H.day[k]!=null)) markDone(); hostRender(true); break;
    case 'dayrand': {
      let k=0; const steps=8;
      const tick=()=>{ DAY.forEach((s,x)=>H.day[x]=Math.floor(Math.random()*s.o.length)); hostRender(true); if(++k<steps && !matchMedia('(prefers-reduced-motion: reduce)').matches) setTimeout(tick, 70+k*25); else markDone(); };
      tick(); break;
    }
    case 'dayreset': H.day={}; hostRender(true); break;
    case 'flip': G.flipped[i]=!G.flipped[i]; save(); hostRender(true); break;
    case 'flipall': { const all = CARDS.every((_,k)=>G.flipped[k]); CARDS.forEach((_,k)=>G.flipped[k]=!all); save(); hostRender(true); break; }
    case 'vote': { G.votes[i]=G.votes[i]||{}; const v=G.votes[i][id]; if(v==null) G.votes[i][id]=1; else if(v===1) G.votes[i][id]=0; else delete G.votes[i][id]; save(); hostRender(true); break; }
    case 'finish': markDone(); toBoard(); break;
    case 'addplayer': G.players.push({id:'m:'+(G.nextId++), name:'Игрок '+(G.players.length+1)}); save(); hostRender(true); break;
    case 'askdel': H.delAsk = id; renderScore(); break;
    case 'copylink': { const t = guestLink(); const done = ()=>{ b.textContent = 'Скопировано ✓'; }; try{ navigator.clipboard.writeText(t).then(done, ()=>{}); }catch(e){} break; }
    case 'broker': room.switchBroker((BROKER_IX+1) % BROKERS.length); lastPush=''; hostRender(true); break;
    case 'delplayer': if (id.startsWith('u:')) room.clearPlayer(id.slice(2)); G.players = G.players.filter(x=>x.id!==id); H.delAsk=null; save(); hostRender(true); break;
    case 'resetask': H.resetAsk=true; hostRender(true); break;
    case 'resetno': H.resetAsk=false; hostRender(true); break;
    case 'reset': { const players = G.players, nextId = G.nextId, ep = (G.ep||1)+1; Object.assign(G, freshGame(), {players, nextId, ep}); H.resetAsk=false; H.day={}; save(); hostRender(true); break; }
  }
}

/* =====================================================================
   PLAYER (гость): только текущий вопрос и своё поле ответа
   ===================================================================== */
const P = { err:'', name: store.get('pname', ''), host:null, key:null, t:'', p:null, sent:'', c:{}, ep:null, editingName:false };
const myPk = () => me.id ? 'u:'+me.id : 'n:'+P.name.trim().toLowerCase();

function findHost(peers){
  let best = null;
  for (const pr of peers){ const h = pr.presence && pr.presence.host; if (h && h.role==='host' && (!best || pr.updatedAt > best.at)) best = {h, at:pr.updatedAt}; }
  return best ? best.h : null;
}
function playerPresence(patch){ if (room) room.presence(patch).then(()=>{ if(P.err){ P.err=''; playerRender(); } }).catch(e=>{ P.err = (e && (e.code||e.message)) || 'ошибка'; playerRender(); }); }

function onHostChange(h){
  P.host = h;
  if (h){
    if (P.ep !== h.ep){ P.ep = h.ep; P.c = {}; playerPresence({ep:h.ep, c:{}, a:null}); }
    const th = THEMES[h.t];
    const k = h.v==='theme' && th && th.items ? key(th.id, h.q) : null;
    if (k !== P.key){ P.key = k; P.t=''; P.p=null; P.sent=''; playerPresence({a:null}); }
  }
  playerRender();
}

function myTotal(){ const h = P.host; const r = h && Array.isArray(h.pl) ? h.pl.find(x=>x[0]===myPk()) : null; return r ? (+r[2]||0) : 0; }

function playerRender(){
  const ta = document.getElementById('my-answer');
  const focused = ta && document.activeElement === ta;
  const h = P.host;
  let html = '';
  if (!P.name || P.editingName){
    html = `<section class="stage phone join">
      <p class="qtext">Привет! Как тебя зовут?</p>
      <p class="hint">Имя увидят все на большом экране в рейтинге.</p>
      <form id="join-form" class="joinrow">
        <input id="my-name" maxlength="30" value="${esc(P.name)}" placeholder="Твоё имя" autocomplete="nickname" required>
        <button class="btn primary" type="submit">Играть</button>
      </form>
    </section>`;
    app.innerHTML = html; return;
  }
  const top = `<div class="me-bar"><span>Ты играешь как <b>${esc(P.name)}</b> · <button class="linkish" data-a="rename">сменить имя</button></span><span class="mypts">${myTotal()} ${plural(myTotal(),'очко','очка','очков')}</span></div>`;
  if (!room){
    html = `<section class="stage phone"><p class="qtext">Не получилось подключиться к игре</p>
      <p>Обнови страницу. Если не помогло — попроси у Лизы свежий QR-код.</p></section>`;
  } else if (!h){
    html = `${top}<section class="stage phone"><p class="qtext">Ждём ведущую…</p><p class="hint">Как только Лиза откроет игру на большом экране, здесь появится вопрос.</p></section>`;
  } else if (h.v==='menu'){
    html = `${top}<section class="stage phone"><p class="qtext">Ведущая выбирает тему…</p><p class="hint">Смотри на большой экран. Вопрос появится здесь сам.</p></section>`;
  } else if (h.v==='board'){
    const players = (Array.isArray(h.pl)?h.pl:[]).map(x=>({id:String(x[0]), name:String(x[1]||'Игрок'), s:+x[2]||0}));
    const rows = boardRows(players, p=>p.s);
    html = `${top}<section class="stage phone"><p class="qtext">🏆 Рейтинг</p>
      <ol class="mini-board">${rows.map(r=>`<li class="${r.p.id===myPk()?'mine':''}"><span class="rk">${medal(r)}</span><span class="nm">${esc(r.p.name)}${r.p.id===myPk()?' (ты)':''}</span><b>${r.tot}</b></li>`).join('')}</ol></section>`;
  } else {
    const th = THEMES[h.t];
    if (!th){ html = top; }
    else if (th.type==='day'){
      const chosen = dayStory(h.d||[]);
      html = `${top}<section class="stage phone"><div class="qnum">${th.n}. ${esc(th.title)}</div>
        <p class="qtext">Смотри на большой экран и предлагай варианты вслух!</p>
        <div class="story"><h3>Лучший день Владика</h3>${chosen.length?`<p>${chosen.map(esc).join(' ')}</p>`:'<p class="empty">История ещё собирается…</p>'}</div></section>`;
    } else if (th.type==='cards'){
      const fl = h.fl || [];
      html = `${top}<section class="stage phone"><div class="qnum">${th.n}. ${esc(th.title)}</div>
        <p class="hint">Голосуй по каждой вещи. Когда ведущая перевернёт карточку, голос уже не поменять.</p>
        <div class="pcards">${CARDS.map((c,i)=>{
          const v = P.c[i]; const open = !!fl[i];
          const res = open ? (v==null ? '<span class="mark n">не голосовал(а)</span>' : v===c.v ? '<span class="mark y">угадал(а) +1</span>' : '<span class="mark n">мимо</span>') : '';
          return `<div class="pcard ${open?'open':''}">
            <span class="pe">${c.e}</span>
            <div class="pc-body"><b>${esc(c.n)}</b>${open?`<span class="hint">${c.v?'Не может жить':'Переживёт'}</span>`:''}${res}</div>
            <div class="pc-btns">
              <button class="${v===1?'sel':''}" data-a="pvote" data-i="${i}" data-v="1" ${open?'disabled':''}>Не может</button>
              <button class="${v===0?'sel':''}" data-a="pvote" data-i="${i}" data-v="0" ${open?'disabled':''}>Переживёт</button>
            </div></div>`;
        }).join('')}</div></section>`;
    } else {
      const it = th.items[h.q]; if (!it){ app.innerHTML = top; return; }
      const rev = !!h.rev;
      let ctl = '';
      const C = it.dyn ? (+h.rc||0) : it.c;
      if (!!it.o){
        ctl = `${it.part ? `<p class="hint">Смотри фото на большом экране и выбери букву.</p>` : ''}<div class="popts">${it.o.map((o,i)=>{
          let cls = P.p===i ? 'sel' : '';
          if (rev){ if (i===C) cls='right'; else if (P.p===i) cls='wrong'; }
          return `<button class="opt ${cls}" data-a="ppick" data-i="${i}" ${rev?'disabled':''}><span class="l">${LET[i]}</span>${esc(o)}</button>`;
        }).join('')}</div>
        ${!rev ? `<p class="hint">${P.p!=null?'Ответ принят ✓ Можно поменять, пока ведущая не открыла ответ.':'Нажми на вариант — ответ сразу уйдёт ведущей.'}</p>` : ''}`;
        if (rev) ctl += `<div class="answer"><span class="lbl">${P.p===C?'Верно! +1':P.p==null?'Ты не ответил(а)':'Мимо'}</span><span class="big">${LET[C]}. ${esc(it.o[C])}</span>${it.f?`<span class="fact">${esc(it.f)}</span>`:''}</div>`;
      } else {
        const ph = th.id==='joke' ? 'Твоя концовка…' : th.id==='vlad' ? 'Как ты думаешь, что ответила Лиза?' : 'Твой ответ…';
        if (!rev){
          ctl = `<form id="answer-form" class="pans">
            <textarea id="my-answer" maxlength="300" rows="3" placeholder="${ph}">${esc(P.t)}</textarea>
            <button class="btn primary" type="submit">${P.sent ? 'Изменить ответ' : 'Отправить ответ'}</button>
            ${P.sent ? `<p class="hint">Ответ принят ✓ «${esc(P.sent)}». Можно поменять, пока ведущая не открыла ответ.</p>` : ''}
          </form>`;
        } else {
          const ok = (h.ok||[]).includes(myPk());
          const right = th.type==='liza' ? (it.a ? 'Ответ Лизы: '+esc(it.a) : 'Ответ Лизы — на большом экране') : (th.id==='joke' ? 'Концовка: ' : '') + esc(it.a);
          ctl = `<div class="answer"><span class="lbl">${ok ? 'Засчитано! +1' : P.sent ? 'Ведущая проверяет…' : 'Ты не ответил(а)'}</span>
            <span class="big">${right}</span>
            ${P.sent ? `<span class="fact">Твой ответ: «${esc(P.sent)}»</span>` : ''}</div>`;
        }
      }
      html = `${top}<section class="stage phone">
        <div class="qnum">${th.n}. ${esc(th.title)} · ${th.id==='joke'?'анекдот':'вопрос'} ${h.q+1} из ${th.items.length}</div>
        <p class="qtext">${esc(it.q)}</p>
        ${ctl}
      </section>`;
    }
  }
  const conn = room ? (room.connected && room.connected() ? 'подключено' : 'подключаемся…') : 'нет';
  const others = room && room.peers ? room.peers().filter(x=>!x.sameTab).length : 0;
  html += `<p class="diag">Связь: ${conn} · ведущая: ${P.host ? 'на связи ✓' : 'не видна'} · других на странице: ${others}${P.err ? ' · ошибка: '+esc(P.err) : ''}</p>`;
  app.innerHTML = html;
  if (focused){ const n = document.getElementById('my-answer'); if (n){ n.focus(); n.setSelectionRange(n.value.length, n.value.length); } }
}

function playerClick(a, b){
  const i = +b.dataset.i;
  switch(a){
    case 'rename': P.editingName = true; playerRender(); break;
    case 'ppick': {
      if (!P.host || P.host.rev || !P.key) break;
      P.p = P.p===i ? null : i;
      playerPresence({a: P.p==null ? null : {k:P.key, p:P.p}});
      playerRender(); break;
    }
    case 'pvote': {
      const fl = (P.host && P.host.fl) || []; if (fl[i]) break;
      const v = +b.dataset.v;
      if (P.c[i] === v) delete P.c[i]; else P.c[i] = v;
      playerPresence({c: Object.assign({}, P.c)});
      playerRender(); break;
    }
  }
}

document.addEventListener('submit', e=>{
  e.preventDefault();
  if (e.target.id === 'join-form'){
    const v = document.getElementById('my-name').value.trim().slice(0,30); if (!v) return;
    P.name = v; P.editingName = false; store.set('pname', v);
    playerPresence({role:'player', name:v, ep:P.ep});
    playerRender();
  }
  if (e.target.id === 'answer-form'){
    const v = document.getElementById('my-answer').value.trim().slice(0,300);
    if (!P.key || (P.host && P.host.rev)) return;
    P.t = v; P.sent = v;
    playerPresence({a: v ? {k:P.key, t:v} : null});
    document.activeElement && document.activeElement.blur && document.activeElement.blur();
    playerRender();
  }
});

/* =====================================================================
   wiring
   ===================================================================== */
document.addEventListener('click', e=>{
  const b = e.target.closest('[data-a]'); if(!b) return;
  if (b.dataset.a === 'localhost'){ startHost(); return; }
  if (ROLE==='host') hostClick(b.dataset.a, b);
  else if (ROLE==='player') playerClick(b.dataset.a, b);
});
document.addEventListener('input', e=>{
  const t = e.target;
  if (ROLE==='host'){
    if (t.dataset.player!=null){ const pl = G.players.find(x=>x.id===t.dataset.player); if(pl){ pl.name=t.value; save(); } }
    if (t.dataset.liza!=null){ H.liza[+t.dataset.liza]=t.value; store.set('liza',H.liza); }
  } else if (t.id === 'my-answer'){ P.t = t.value; }
});
document.addEventListener('change', async e=>{
  if (ROLE!=='host') return;
  const t = e.target, th = THEMES[H.t], it = th && th.items ? th.items[H.q] : null;
  if (!it || !it.part) return;
  PH[it.part] = PH[it.part] || {imgs:[], c:0};
  if (t.dataset.vladc != null){ PH[it.part].c = +t.dataset.vladc; syncBody(); store.set('photos', PH); hostRender(true); }
  if (t.dataset.photo != null && t.files && t.files[0]){
    try{
      const url = await shrinkImage(t.files[0]);
      const prev = PH[it.part].imgs[+t.dataset.photo];
      PH[it.part].imgs[+t.dataset.photo] = url;
      if (!store.set('photos', PH)){ PH[it.part].imgs[+t.dataset.photo] = prev; H.photoErr = 'Не хватило места в браузере. Попробуйте фото поменьше или удалите лишние.'; }
      else H.photoErr = '';
    }catch(err){ H.photoErr = 'Не получилось открыть это фото. Попробуйте другое (JPG или PNG).'; }
    hostRender(true);
  }
});
document.addEventListener('focusout', ()=>{ if (ROLE==='host') setTimeout(()=>{ if (H.pending && !(document.activeElement && document.activeElement.matches && document.activeElement.matches('input'))) hostRender(true); }, 0); });
document.addEventListener('keydown', e=>{
  if (ROLE!=='host') return;
  if (e.target.matches('input,textarea')) return;
  if (H.view!=='theme') return;
  const type = THEMES[H.t].type;
  if (e.key==='Escape'){ toMenu(); return; }
  if (type==='day' || type==='cards') return;
  if (e.key==='ArrowRight'){ e.preventDefault(); next(); }
  else if (e.key==='ArrowLeft'){ e.preventDefault(); goQ(H.q-1); }
  else if (e.key===' ' && !isRev(key(THEMES[H.t].id,H.q)) && !e.target.closest('button')){ e.preventDefault(); reveal(); }
});

function startHost(){
  ROLE = 'host'; document.body.dataset.role = 'host';
  hostRender(true);
  if (room){
    room.onPeers(ch => ingest(ch.peers), e=>{ H.err = e.code; renderScore(); });
    if (room.onConnection) room.onConnection(()=>{ hostRender(); if (room.connected()) { lastPush=''; pushHost(); } });
  }
}
function startPlayer(){
  ROLE = 'player'; document.body.dataset.role = 'player';
  document.getElementById('subtitle').textContent = 'Отвечай с телефона — вопросы на большом экране';
  if (P.name) playerPresence({role:'player', name:P.name});
  playerRender();
  if (room){
    room.onPeers(ch => { const h = findHost(ch.peers); if (JSON.stringify(h) !== JSON.stringify(P.host)) onHostChange(h); else if (ch.joined.length || ch.left.length) playerRender(); }, e=>{ P.err = e.code; playerRender(); });
    if (room.onConnection) room.onConnection(()=>playerRender());
  }
}

/* =====================================================================
   transport: free public MQTT broker, no accounts needed.
   Same small interface the game used before: presence / onPeers / peers / connected.
   ===================================================================== */
const BROKERS = [
  'wss://broker.emqx.io:8084/mqtt',
  'wss://broker.hivemq.com:8884/mqtt',
  'wss://test.mosquitto.org:8081/mqtt',
];
const rid = n => Array.from(crypto.getRandomValues(new Uint8Array(n)), x => 'abcdefghjkmnpqrstuvwxyz23456789'[x % 31]).join('');
const params = new URLSearchParams(location.search);
const GUEST_CODE = params.get('g');
const IS_GUEST = !!GUEST_CODE;
const GAME = IS_GUEST ? GUEST_CODE.replace(/[^a-z0-9]/g,'').slice(0,12) : (store.get('code', null) || (()=>{ const c = rid(6); store.set('code', c); return c; })());
let BROKER_IX = IS_GUEST ? Math.min(Math.max(+params.get('b')||0,0),BROKERS.length-1) : (+store.get('broker', 0) || 0);
const MY_ID = store.get('pid', null) || (()=>{ const c = rid(10); store.set('pid', c); return c; })();
const guestLink = () => location.origin + location.pathname + '?g=' + GAME + '&b=' + BROKER_IX;

function makeRoom(){
  const base = 'vladikquiz/' + GAME + '/';
  const myTopic = IS_GUEST ? base + 'p/' + MY_ID : base + 'host';
  const others = {};            // id -> {presence, updatedAt}
  let mine = {}, client = null, isConn = false, peersCache = [];
  const peerH = [], connH = [];
  const rebuild = () => { peersCache = Object.entries(others).map(([id,v])=>({peer:id, by:id, isMe:false, sameTab:false, kind:'viewer', guest:false, presence:v.presence, updatedAt:v.updatedAt})); peerH.forEach(h=>h({peers:peersCache, joined:[], left:[], updated:[]})); };
  let pubTimer = null;
  const publishMine = () => { clearTimeout(pubTimer); pubTimer = setTimeout(()=>{ if (client && isConn) client.publish(myTopic, JSON.stringify(mine), {retain:true, qos:1}); }, 60); };
  function connect(){
    if (!window.mqtt){ return; }
    client = mqtt.connect(BROKERS[BROKER_IX], {clientId:'vq_'+rid(10), clean:true, reconnectPeriod:2500, connectTimeout:8000, keepalive:30});
    client.on('connect', ()=>{
      isConn = true;
      client.subscribe(IS_GUEST ? base + 'host' : base + 'p/+', {qos:1});
      if (Object.keys(mine).length) publishMine();
      connH.forEach(h=>h(true));
    });
    const down = ()=>{ if (isConn){ isConn = false; connH.forEach(h=>h(false)); } };
    client.on('close', down); client.on('offline', down);
    client.on('error', ()=>{});
    client.on('message', (topic, buf)=>{
      const id = topic.slice(base.length).replace(/^p\//,'');
      const txt = buf.toString();
      if (!txt){ delete others[id]; rebuild(); return; }
      try{ const p = JSON.parse(txt); if (p && typeof p === 'object'){ others[id] = {presence:p, updatedAt:Date.now()}; rebuild(); } }catch(e){}
    });
  }
  connect();
  return {
    presence(patch){ for (const [k,v] of Object.entries(patch)){ if (v === null) delete mine[k]; else mine[k] = v; } publishMine(); return Promise.resolve(); },
    onPeers(h){ peerH.push(h); setTimeout(()=>h({peers:peersCache, joined:[], left:[], updated:[]}),0); return ()=>{}; },
    onConnection(h){ connH.push(h); return ()=>{}; },
    peers(){ return peersCache; },
    connected(){ return isConn; },
    clearPlayer(id){ if (client && isConn) client.publish(base + 'p/' + id, '', {retain:true, qos:1}); delete others[id]; rebuild(); },
    switchBroker(ix){ BROKER_IX = ix; store.set('broker', ix); try{ client && client.end(true); }catch(e){} isConn=false; Object.keys(others).forEach(k=>delete others[k]); rebuild(); connect(); connH.forEach(h=>h(false)); },
  };
}

function qrSvg(text){
  try{ const q = qrcode(0, 'M'); q.addData(text); q.make(); return q.createSvgTag({cellSize:6, margin:2, scalable:true}); }catch(e){ return ''; }
}

app.innerHTML = `<section class="stage"><p class="qtext">Подключаемся к игре…</p></section>`;
room = makeRoom();
me.id = MY_ID;
if (IS_GUEST) startPlayer(); else startHost();
</script>
